; Expandor — Supervisor (queue worker)
; Copiar para: /etc/supervisor/conf.d/expandor-worker.conf
; Depois:
;   supervisorctl reread
;   supervisorctl update
;   supervisorctl status

[program:expandor-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/expandor/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=120
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/expandor/storage/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=3600
